# Dev-only additions — auto-merged on top of docker-compose.yml by
# `docker compose up` with no -f flags. Never applied on the Dokploy host.
# Locally the app is published through the shared Caddy `local-proxy` network:
#   http://poloperator-reffing.localhost  (no host port is published).
services:
  app:
    build:
      context: ./webapp
      target: dev
    command: pnpm dev
    volumes:
      - ./webapp:/workspace
      - /workspace/node_modules
    networks:
      - private
      - proxy
    labels:
      caddy: poloperator-reffing.localhost
      caddy.reverse_proxy: "{{upstreams 3003}}"
    environment:
      NODE_ENV: development

networks:
  private:
  proxy:
    external: true
    name: local-proxy
