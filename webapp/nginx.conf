server {
    listen 3003;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy poloperator (CORS-blocked for the browser) to the upstream site.
    # Same path prefix as the Vite dev proxy in vite.config.ts.
    location /poloperator/ {
        proxy_pass https://poloperator.com/;
        proxy_set_header Host poloperator.com;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}